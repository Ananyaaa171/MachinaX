# ============================================================
# MACHINA-X Backend — Application Configuration
# ============================================================

# --- Server ---
server.port=8080

# --- PostgreSQL DataSource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/machinax_db
spring.datasource.username=machinax_user
spring.datasource.password=machinax_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway Migrations ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


# --- Logging ---
logging.level.com.machinax=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO

# --- CORS (allow React dev server) ---
machinax.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- ML Service ---
machinax.ml-service.base-url=http://localhost:8000

# --- Sensor Simulation ---
machinax.simulation.enabled=true
machinax.simulation.interval-ms=5000
